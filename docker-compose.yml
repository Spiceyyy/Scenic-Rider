# Local PostGIS for the Scenic Viber ETL.  Usage:  docker compose up -d
# Credentials come from .env (copy .env.example). Host port defaults to 5433 so it
# does not clash with a locally installed PostgreSQL on 5432.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scenic}
      POSTGRES_USER: ${POSTGRES_USER:-scenic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
